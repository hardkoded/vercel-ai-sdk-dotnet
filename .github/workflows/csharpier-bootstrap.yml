# Temporary: formats the codebase once for the CSharpier PR. Delete after it runs.
name: CSharpier bootstrap

on:
  push:
    branches:
      - chore/csharpier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/csharpier
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Format
        run: dotnet tool restore && dotnet csharpier format .
      - name: Commit format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to format"; exit 0; fi
          git commit -q -F - <<'MSG'
          Format codebase with CSharpier

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01Ls2e1y2tkZNP6dfy8F5GTF
          MSG
      - name: Regenerate markdown snippets
        env:
          HUSKY: "0"
        run: |
          dotnet build examples/GenerateText/GenerateText.csproj -c Release --nologo
          git add -A -- '*.md'
          if git diff --cached --quiet; then echo "Snippets up to date"; exit 0; fi
          git commit -q -F - <<'MSG'
          Update markdown snippets after CSharpier format

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01Ls2e1y2tkZNP6dfy8F5GTF
          MSG
      - name: Show result
        run: git log --oneline -5 && git status --short
      - name: Push
        run: git push origin HEAD:chore/csharpier
